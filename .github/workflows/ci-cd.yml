name: KnowledgeAI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ========================================================
  # Job 1: Build & Validate (Continuous Integration)
  # ========================================================
  ci:
    name: Build & Test (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Backend Code Compilation
        run: |
          python -m compileall backend/app

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

  # ========================================================
  # Job 2: Auto-Deploy to AWS EC2 (Continuous Deployment)
  # ========================================================
  cd:
    name: Deploy to AWS EC2 (CD)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Deploying latest code to EC2..."
            
            cd ~/Knowledge_AI
            git pull origin main
            
            # --- Update Backend ---
            echo "📦 Updating Backend..."
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Run Alembic migrations
            alembic upgrade head || true
            
            # Restart backend process in PM2
            pm2 restart knowledge-backend
            
            # --- Update Frontend ---
            echo "🎨 Building Frontend..."
            cd ../frontend
            npm install
            npm run build
            
            # --- Reload Nginx ---
            echo "🌐 Reloading Nginx..."
            sudo systemctl reload nginx
            
            echo "✅ Deployment completed successfully!"
